
<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>COFFEE 123 - 三步沖出好咖啡</title>
    
    <!-- PWA / iOS Support -->
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="COFFEE 123">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/924/924514.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #fdfaf3; 
        color: #000; 
        /* 防止 iPhone 橡皮筋回彈效果影響體驗 */
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
      .retro-shadow { box-shadow: 8px 8px 0px 0px rgba(0, 0, 0, 1); }
      .retro-shadow-sm { box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 1); }
      .retro-border { border: 3px solid black; }
      .retro-border-sm { border: 2px solid black; }
      
      /* 優化 iOS 按鈕點擊感 */
      button:active { transform: scale(0.98); }
      
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 28px;
        height: 28px;
        background: black;
        border: 3px solid white;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 0 0 2px black;
      }

      /* 針對 iPhone 安全區域 (Notch) 的優化 */
      .safe-top { padding-top: env(safe-area-inset-top); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "jszip": "https://esm.sh/jszip@3.10.1"
      }
    }
    </script>
  </head>
  <body class="safe-top">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
